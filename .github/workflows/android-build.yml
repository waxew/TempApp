name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APKs
        run: gradle assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TempApp-v1.0.0-apks
          path: app/build/outputs/apk/**/*.apk
