name: Signed Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/signed-release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/MasterKey.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore and validate signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
      - name: Build release
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Sign and verify APK
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk')
          test "${#APKS[@]}" -eq 1
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "${APKS[0]}" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KEYSTORE_PATH" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out dist/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs dist/app-release.apk > dist/signature.txt
          "$BT/aapt" dump badging dist/app-release.apk > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import os,re,pathlib
          line=pathlib.Path(os.environ["RUNNER_TEMP"]+"/badging.txt").read_text().splitlines()[0]
          attrs=dict(re.findall(r"(\w+)='([^']*)'",line))
          name=os.environ["GITHUB_REPOSITORY"].split("/")[1]
          version=attrs["versionName"]; code=attrs["versionCode"]
          safe=re.sub(r"[^a-zA-Z0-9._-]","_",version)
          pathlib.Path("dist/app-release.apk").rename(f"dist/{name}-v{safe}-{code}-release.apk")
          tag=f"v{safe}-build-{os.environ['GITHUB_RUN_NUMBER']}"
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write(f"RELEASE_TAG={tag}\n")
          pathlib.Path("dist/release-notes.md").write_text(f"{name}\n\nVersion: {version}\nVersion code: {code}\nApplication ID: {attrs['name']}\nCommit: {os.environ['GITHUB_SHA']}\n\nRelease APK signed with the configured signing key and verified with apksigner.\n\nA new signing key does not directly update installations signed with a different key.\n")
          PY
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/signature.txt dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file dist/release-notes.md
      - name: Remove temporary key
        if: always()
        run: rm -f "$KEYSTORE_PATH"
