name: AlanRang Private Clean Build

on:
  workflow_dispatch:
  push:
    branches:
      - alanrang-private-clean-build
    paths:
      - 'alanrang_build/**'
      - '.github/workflows/alanrang-private-clean-build.yml'

permissions:
  contents: read

jobs:
  build-clean-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        working-directory: alanrang_build
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify compiled package identity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find alanrang_build/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          AAPT="$BT/aapt"
          BADGING=$("$AAPT" dump badging "$APK" | head -n 1)
          echo "APK=$APK"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='ir.alanrang.private1405'"
          echo "$BADGING" | grep -q "versionCode='1405001'"
          echo "$BADGING" | grep -q "versionName='1.0.0-rc.2'"
          sha256sum "$APK" | tee alanrang_build/UNSIGNED_APK_SHA256.txt

      - name: Package local signing utilities
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          OUT=alanrang_build/android-signing-tools
          LIBOUT="$OUT/host-libs"
          mkdir -p "$LIBOUT"
          cp "$BT/lib/apksigner.jar" "$OUT/"
          cp "$BT/zipalign" "$OUT/"
          cp "$BT/aapt" "$OUT/"
          cp "$BT/aapt2" "$OUT/"
          chmod +x "$OUT/zipalign" "$OUT/aapt" "$OUT/aapt2"
          printf '%s\n' "$(basename "$BT")" > "$OUT/BUILD_TOOLS_VERSION.txt"
          for BIN in "$BT/zipalign" "$BT/aapt" "$BT/aapt2"; do
            ldd "$BIN" || true
            ldd "$BIN" | awk '/=> \/.*\(/ {print $3}' | while read -r LIB; do
              test -f "$LIB" && cp -L "$LIB" "$LIBOUT/" || true
            done
          done
          test -f "$LIBOUT/libc++.so" || test -f "$LIBOUT/libc++.so.1"

      - name: Upload unsigned clean shell and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: AlanRang-Private-Clean-Shell-RC2
          if-no-files-found: error
          retention-days: 7
          path: |
            alanrang_build/app/build/outputs/apk/release/*.apk
            alanrang_build/UNSIGNED_APK_SHA256.txt
            alanrang_build/android-signing-tools/**
